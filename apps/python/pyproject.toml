[project]
name = "hotkey-tools-python"
version = "0.1.0"
description = "FastAPI service for hotkey-tools on Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "hotkey-tools-core", "pydantic>=2.10,<3"]

[tool.uv.sources]
hotkey-tools-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotkey_tools"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "uvicorn[standard]>=0.34,<1", "workers-py", "workers-runtime-sdk"]

[tool.uv]
package = true
