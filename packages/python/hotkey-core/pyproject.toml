[project]
name = "hotkey-tools-core"
version = "0.1.0"
description = "Shared hotkey utilities for Python workspace members"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotkey_tools_core"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/py.typed" }]
